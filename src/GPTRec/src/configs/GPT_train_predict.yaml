cuda_visible_devices: 0

project_name: sequential_recsys/generation_paper
task_name: GPT_train_predict
seed: 42
results_root: ${oc.env:EXPERIMENT_OUTPUT_DIR,../../../exp_results}

hydra:
  run:
    dir: ${results_root}/service_files/other_service_files/hydra/GPTRec/${dataset_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false

dataset_name: ml-1m
amazon_data_dir: ../../data/amazon
# data_path: ../data/ml-20m.csv
last_n_items: 10

dataset:
  max_length: 50 #128
  shift_labels: True #False

dataloader:
  batch_size: 64
  test_batch_size: 16
  num_workers: 2
  validation_size: 10000

model: 'GPT-2'
model_params:
  n_positions: ${dataset.max_length}   # 128
  n_embd: 64
  n_layer: 2
  n_head: 1

seqrec_module:
  lr: 0.001
  predict_top_k: 10  # this value is used for validation
  filter_seen: True

trainer_params:
  max_epochs: 100
patience: 10

evaluator:
  # top_k: [10]
  top_k: [10, 20, 100]
test_metrics: True

mode: 'relevance_aggregation'

generation_params:
  num_return_sequences: 30
  do_sample: true
  temperature: 1.0
  top_k: 0

ra_temperature_grid: [0.3, 0.5, 0.8, 1.0, 1.2, 1.6, 2.0, 3.0, 5.0]
ra_temperature_selection_k: 10
ra_temperature: auto

generation: true

final_train: false
final_epochs: 150
resume_checkpoint: null
