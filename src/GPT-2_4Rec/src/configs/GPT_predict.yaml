cuda_visible_devices: 0

model_checkpoint: best_model.pt

data_path: ../data/ml-20m.csv
global_time_col: timestamp
split_ratios: [0.7, 0.1, 0.1, 0.1]

dataset:
  max_length: 128
  shift_labels: false

model: GPT-2
model_params:
  n_positions: 128
  n_embd: 64      # должно совпадать с обучением
  n_layer: 2
  n_head: 1

seqrec_module:
  lr: 0.001
  predict_top_k: 10
  filter_seen: true

dataloader:
  test_batch_size: 16
  num_workers: 8

evaluator:
  top_k: [10]
test_metrics: true

generation: false
mode: 'reciprocal_rank_aggregation'
generation_params:
  num_return_sequences: 1
  do_sample: false
  
